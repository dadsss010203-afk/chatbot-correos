name: Build and Push Docker Image

on:
  push:
    branches: [ "CHABOTBO1" ]  # Se ejecuta cada vez que haces push a esta rama

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Descargar el código
      - name: Descargar código
        uses: actions/checkout@v3

      # Paso 2: Construir la imagen Docker
      - name: Construir imagen Docker
        run: docker build -t dadsss010203-afk/chatbot-correos:latest .

      # Paso 3: Loguearse en Docker Hub usando los secretos
      - name: Loguearse en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Paso 4: Subir la imagen a Docker Hub
      - name: Subir imagen Docker
        run: docker push dadsss010203-afk/chatbot-correos:latest
